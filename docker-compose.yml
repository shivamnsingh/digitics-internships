services:
  digitics:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      DATA_DIR: /data
    volumes:
      - digitics-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  digitics-data:
